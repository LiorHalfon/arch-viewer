name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs the same checks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff format --check
          uv run ruff check
      - name: Tests
        run: uv run pytest
      - name: The tool passes its own rules
        run: uv run archview check

name: Release

# Push a tag like v0.2.0 after bumping `version` in pyproject.toml. The release is
# created only if the tag matches that version and the CI checks pass. The release
# then moves the floating tag v0.2 to it, so `@v0.2` always means the latest 0.2.x.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi

  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build
        run: uv build
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes \
              --title "archview ${GITHUB_REF_NAME#v}"
          fi
      - name: Move the floating minor tag
        run: |
          minor="${GITHUB_REF_NAME%.*}"
          git tag -f "${minor}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${minor}"

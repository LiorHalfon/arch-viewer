[project]
name = "archview"
version = "0.1.0"
description = "Architecture viewer and dependency-rules checker for Python code bases"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lior Halfon" }]
dependencies = [
    "grimp>=3.16",
    "networkx>=3.4",
]

[project.scripts]
archview = "archview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archview"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The fixture project is deliberately odd code, pinned by line number in the golden
# files; `spike/` is exploratory and not held to the product's standards.
extend-exclude = ["tests/fixtures", "spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
